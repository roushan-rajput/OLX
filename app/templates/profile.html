<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dashboard {
      width: 900px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      background: #4a47a3;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .content {
      display: flex;
    }

    .profile {
      width: 40%;
      padding: 20px;
      border-right: 1px solid #eee;
    }

    .profile h2 {
      margin-bottom: 15px;
    }

    .info {
      margin-bottom: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 10px;
      transition: 0.3s;
    }

    .info:hover {
      transform: scale(1.05);
      background: #e0e0ff;
    }

    .orders {
      width: 60%;
      padding: 20px;
    }

    .orders h2 {
      margin-bottom: 15px;
    }

    .order {
      background: #f9f9f9;
      margin-bottom: 10px;
      padding: 15px;
      border-radius: 10px;
      transition: 0.3s;
      cursor: pointer;
    }

    .order:hover {
      transform: translateX(10px);
      background: #dfe6ff;
    }

    .btn {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      background: #4a47a3;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #6c63ff;
      transform: scale(1.1);
    }
  </style>
</head>
<body>

<div class="dashboard">
  <div class="header">
    <h1>User Dashboard</h1>
  </div>

  <div class="content">
    <!-- Profile Section -->
    <div class="profile">
      <h2>Profile Info</h2>
      <div class="info" id="name">Name: Rahul Sharma</div>
      <div class="info" id="email">Email: rahul@email.com</div>
      <div class="info" id="mobile">Mobile: 9876543210</div>
      <div class="info" id="address">Address: Delhi, India</div>

      <button class="btn" onclick="editProfile()">Edit Profile</button>
    </div>

    <!-- Orders Section -->
    <div class="orders">
      <h2>Your Orders</h2>
      <div class="order">📦 iPhone 13 - Delivered</div>
      <div class="order">📦 Bike Helmet - Shipped</div>
      <div class="order">📦 Sofa Set - Processing</div>
    </div>
  </div>
</div>

<script>
  function editProfile() {
    let name = prompt("Enter Name:");
    let email = prompt("Enter Email:");
    let mobile = prompt("Enter Mobile:");
    let address = prompt("Enter Address:");

    if(name) document.getElementById("name").innerText = "Name: " + name;
    if(email) document.getElementById("email").innerText = "Email: " + email;
    if(mobile) document.getElementById("mobile").innerText = "Mobile: " + mobile;
    if(address) document.getElementById("address").innerText = "Address: " + address;
  }
</script>

</body>
</html>
