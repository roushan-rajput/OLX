<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            overflow: hidden;
        }

        /* BACKGROUND ANIMATION */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            animation: float 6s infinite alternate;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -100px;
            right: -100px;
            animation: float 8s infinite alternate;
        }

        /* CARD */
        .profile-card {
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 35px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transition: 0.4s;
            animation: fadeIn 1s ease;
        }

        .profile-card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        /* IMAGE */
        .profile-card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-bottom: 15px;
            transition: 0.4s;
        }

        .profile-card img:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* TEXT */
        .profile-card h2 {
            color: #fff;
            margin: 10px 0;
        }

        .profile-card p {
            color: #eee;
            margin: 5px 0;
        }

        /* INFO BOX */
        .info-box {
            margin-top: 20px;
            text-align: left;
        }

        .info-box p {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
            transition: 0.3s;
        }

        .info-box p:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateX(5px);
        }

        /* BUTTONS */
        .btn-group {
            margin-top: 20px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 10px;
            margin: 5px;
            display: inline-block;
            font-size: 14px;
            transition: 0.3s;
            color: white;
        }

        .edit-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
        }

        .logout-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* ANIMATIONS */
        @keyframes float {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(30px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="profile">

        <h2>{{ user.name }}</h2>
        <p>{{ user.role|title }}</p>

        <div class="info-box">
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Phone:</strong> {{ user.contact }}</p>
            <p><strong>Address:</strong> {{ user.city }}</p>
            <p><strong>Your Password:</strong> {{ user.password }}</p>
        </div>

        <div class="btn-group">
            <a href="/edit_profile/" class="btn edit-btn">Edit Profile</a>
            <a href="/logout_view/" class="btn logout-btn">Logout</a>
        </div>

    </div>

</body>

</html>
