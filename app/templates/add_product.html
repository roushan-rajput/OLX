{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Product Form</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .box {
            width: 380px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: fadeUp 1s ease;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            animation: glow 2s infinite alternate;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-bottom: 2px solid #94a3b8;
            background: transparent;
            color: rgb(0, 0, 0);
            outline: none;
            transition: 0.3s;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus,
        select:focus {
            border-bottom: 2px solid #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            transition: 0.4s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px #667eea;
        }

        .preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: 0.4s;
        }

        .preview:hover {
            transform: scale(1.05);
        }

        /* animations */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #667eea;
            }

            to {
                text-shadow: 0 0 20px #764ba2;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>{% if data %}✏️ Edit Product{% else %}➕ Add Product{% endif %}</h2>

        {% if not data %}
        <form action="{% url 'add_pro' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <select name="productname" required>
                <option value="">Select Product</option>
                <option value="car">Car</option>
                <option value="house">House</option>
                <option value="phones">Phones</option>
                <option value="laptop">Laptop</option>
            </select>

            <input type="text" name="productprice" placeholder="Price" required>
            <input type="text" name="productissue" placeholder="Issue">
            <input type="text" name="productreason" placeholder="Description" required>
            <input type="file" name="productimg" required>

            <button>Add Product 🚀</button>
        </form>

        {% else %}
        <form action="{% url 'update_product' pk=data.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <img src="{{data.productimg.url}}" class="preview">

            <input type="text" name="productname" value="{{data.productname}}" required>
            <input type="text" name="productprice" value="{{data.productprice}}" required>
            <input type="text" name="productissue" value="{{data.productissue}}">
            <input type="text" name="productreason" value="{{data.productreason}}" required>
            <input type="file" name="productimg">

            <button>Update Product ✨</button>

        </form>
        {% endif %}

    </div>

</body>

</html>
