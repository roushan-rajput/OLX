{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Product Form</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Poppins;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>{% if data %}Edit Product{% else %}Add Product{% endif %}</h2>

        {% if not data %}
        <form action="{% url 'add_pro' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="text" name="productname" placeholder="Product Name" required>
            <input type="text" name="productprice" placeholder="Price" required>
            <input type="text" name="productissue" placeholder="Issue">
            <input type="text" name="productreason" placeholder="Reason" required>
            <input type="file" name="productimg" required>

            <button>Add Product</button>

        </form>

        {% else %}
        <form action="{% url 'update_product' pk=data.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <img src="{{data.productimg.url}}" class="preview">

            <input type="text" name="productname" value="{{data.productname}}" required>
            <input type="text" name="productprice" value="{{data.productprice}}" required>
            <input type="text" name="productissue" value="{{data.productissue}}">
            <input type="text" name="productreason" value="{{data.productreason}}" required>
            <input type="file" name="productimg">

            <button>Update Product</button>

        </form>
        {% endif %}

    </div>

</body>

</html>
