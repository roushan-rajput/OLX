<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLX Chat Dashboard</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f5;
}

.container {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 30%;
  background: white;
  border-right: 1px solid #ddd;
  overflow-y: auto;
}

.chat-item {
  padding: 15px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  transition: 0.3s;
}

.chat-item:hover {
  background: #f7f7f7;
}

.chat-item.active {
  background: #e6f7ff;
}

.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.chat-header {
  padding: 15px;
  background: white;
  border-bottom: 1px solid #ddd;
  font-weight: bold;
}

.messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

.message {
  margin-bottom: 10px;
  max-width: 60%;
  padding: 10px;
  border-radius: 10px;
  animation: fadeIn 0.3s ease-in;
}

.sent {
  background: #d1ffd6;
  margin-left: auto;
}

.received {
  background: #fff;
  border: 1px solid #ddd;
}

.input-area {
  display: flex;
  padding: 10px;
  background: white;
  border-top: 1px solid #ddd;
}

input {
  flex: 1;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #23e5db;
  color: black;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #1ccac2;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">

  <div class="sidebar" id="chatList">
    <div class="chat-item active" onclick="selectChat(this, 'User 1')">User 1</div>
    <div class="chat-item" onclick="selectChat(this, 'User 2')">User 2</div>
    <div class="chat-item" onclick="selectChat(this, 'User 3')">User 3</div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader">User 1</div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script>
let currentChat = 'User 1';

const chatData = {
  'User 1': [],
  'User 2': [],
  'User 3': []
};

function selectChat(element, user) {
  document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
  element.classList.add('active');
  currentChat = user;
  document.getElementById('chatHeader').innerText = user;
  renderMessages();
}

function renderMessages() {
  const container = document.getElementById('messages');
  container.innerHTML = '';

  chatData[currentChat].forEach(msg => {
    const div = document.createElement('div');
    div.classList.add('message', msg.type);
    div.innerText = msg.text;
    container.appendChild(div);
  });

  container.scrollTop = container.scrollHeight;
}

function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text) return;

  chatData[currentChat].push({ text, type: 'sent' });

  setTimeout(() => {
    chatData[currentChat].push({ text: 'Auto reply...', type: 'received' });
    renderMessages();
  }, 1000);

  input.value = '';
  renderMessages();
}
</script>

</body>
</html>
