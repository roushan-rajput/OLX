<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
}

.card {
    width: 420px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
}

.profile-img {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px solid #38bdf8;
    margin-bottom: 15px;
}

.name {
    font-size: 22px;
    font-weight: 600;
}

.role {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 20px;
}

.info {
    text-align: left;
    margin-top: 20px;
}

.info div {
    background: rgba(255,255,255,0.05);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 14px;
}

.info strong {
    color: #38bdf8;
}

.actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

.btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    transition: 0.3s;
}

.edit {
    background: #38bdf8;
    color: #000;
}

.logout {
    background: #ef4444;
    color: #fff;
}

.btn:hover {
    transform: translateY(-2px);
    opacity: 0.9;
}

</style>
</head>
<body>

<div class="card">

    <img class="profile-img" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="profile">

    <div class="name">{{ user.name }}</div>
    <div class="role">{{ user.role|title }}</div>

    <div class="info">
        <div><strong>Email:</strong> {{ user.email }}</div>
        <div><strong>Phone:</strong> {{ user.contact }}</div>
        <div><strong>City:</strong> {{ user.city }}</div>
        <div><strong>Password:</strong> {{ user.password }}</div>
    </div>

    <div class="actions">
        <a href="/edit_profile/" class="btn edit">Edit</a>
        <a href="/logout_view/" class="btn logout">Logout</a>
    </div>

</div>

</body>
</html>
