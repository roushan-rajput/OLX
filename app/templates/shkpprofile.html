<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile-card {
            background: #fff;
            width: 400px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            padding: 30px;
            text-align: center;
        }

        .profile-card img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 15px;
        }

        .profile-card h2 {
            margin: 10px 0;
            color: #333;
        }

        .profile-card p {
            color: #666;
            margin: 5px 0;
        }

        .info-box {
            text-align: left;
            margin-top: 20px;
        }

        .info-box p {
            background: #f4f6ff;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .btn-group {
            margin-top: 20px;
        }

        .btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            margin: 5px;
            display: inline-block;
            font-size: 14px;
            transition: 0.3s;
        }

        .edit-btn {
            background: #667eea;
            color: white;
        }

        .logout-btn {
            background: #ff4d4d;
            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="profile-card">

    <!-- Profile Image (static for now) -->
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="profile">

    <h2>{{ user.name }}</h2>
    <p>{{ user.role|title }}</p>

    <div class="info-box">
        <p><strong>Email:</strong> {{ user.email }}</p>
        <p><strong>Phone:</strong> {{ user.contact }}</p>
        <p><strong>Address:</strong> {{ user.city }}</p>
        <p><strong>Your Password:</strong> {{ user.password }}</p>
    </div>

    <div class="btn-group">
        <a href="/edit_profile/" class="btn edit-btn">Edit Profile</a>
        <a href="/logout_view/" class="btn logout-btn">Logout</a>
    </div>

</div>

</body>
</html>
