<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chat</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }

        .chat-container {
            height: 95vh;
            display: flex;
        }

        .chat-box {
            width: 70%;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
        }

        .chat-header {
            padding: 15px;
            background: linear-gradient(45deg, #2563eb, #1e40af);
            color: white;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            max-width: 65%;
            padding: 10px 14px;
            border-radius: 15px;
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
        }

        .sent {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }

        .received {
            background: #e5e7eb;
            align-self: flex-start;
        }

        .chat-input {
            padding: 10px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #ccc;
        }

        .side-panel {
            width: 30%;
            padding: 15px;
            background: #f8fafc;
            border-left: 1px solid #ddd;
        }

        .status {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 3px;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(10px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- CHAT -->
    <div class="chat-box">

        <div class="chat-header">
            💬 Chat with {{ other_user }}
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <form class="chat-input">
            {% csrf_token %}

            <input type="text" id="messageInput" placeholder="Type message..." required>

            <input type="hidden" id="receiver" value="{{ other_user }}">
            <input type="hidden" id="product_id" value="{{ product.id }}">

            <button class="btn btn-primary">Send</button>
        </form>

    </div>

    <!-- SIDE PANEL -->
    <div class="side-panel">

        <div class="card p-3 mb-3 shadow-sm">
            <img src="{{ product.productimg.url }}" class="img-fluid mb-2">
            <h6>{{ product.productname }}</h6>
            <p>₹{{ product.productprice }}</p>
            <small>{{ product.productissue }}</small>
        </div>

        <div class="card p-3 shadow-sm">
            <h6>User Details</h6>

            {% if other_user_data %}
            <p><b>Name:</b> {{ other_user_data.name }}</p>
            <p><b>Email:</b> {{ other_user_data.email }}</p>
            <p><b>City:</b> {{ other_user_data.city }}</p>
            {% endif %}
        </div>

    </div>

</div>

<script>

const chatBox = document.getElementById("chatBox");
const receiver = document.getElementById("receiver").value;
const product_id = document.getElementById("product_id").value;
const messageInput = document.getElementById("messageInput");

// ✅ ADD MESSAGE UI
function addMessage(text, type, status = "") {
    let div = document.createElement("div");
    div.className = "message " + type;

    let content = document.createElement("div");
    content.innerText = text;

    let stat = document.createElement("div");
    stat.className = "status";
    stat.innerText = status;

    div.appendChild(content);
    div.appendChild(stat);

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// 🔄 LOAD MESSAGES
function loadMessages() {
    fetch(`/userchatdata/?receiver=${receiver}&product_id=${product_id}`)
        .then(res => res.json())
        .then(data => {

            chatBox.innerHTML = "";

            data.messages.forEach(msg => {

                if (msg.sender === "{{ request.session.email }}") {
                    addMessage(msg.message, "sent", "✔ Sent");
                } else {
                    addMessage(msg.message, "received");
                }

            });

        });
}

// 🔁 AUTO REFRESH (VERY IMPORTANT 🔥)
setInterval(loadMessages, 2000);
loadMessages();

// 📤 SEND MESSAGE
document.querySelector(".chat-input").addEventListener("submit", function (e) {
    e.preventDefault();

    let message = messageInput.value.trim();
    if (message === "") return;

    // UI instant
    let tempDiv = document.createElement("div");
    tempDiv.className = "message sent";
    tempDiv.innerText = message + " ⏳";
    chatBox.appendChild(tempDiv);

    fetch("/userchatdata/", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: `message=${encodeURIComponent(message)}&receiver=${receiver}&product_id=${product_id}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "sent") {
            tempDiv.innerText = message + " ✅";
            alert("✅ Message Sent Successfully");
        } else {
            tempDiv.innerText = message + " ❌ Failed";
            alert("❌ Message Failed");
        }
    });

    messageInput.value = "";
});

</script>

</body>
</html>
