<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Chat Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: white;
}

.chat-card {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    transition: 0.3s;
}

.chat-card:hover {
    transform: scale(1.01);
}

.avatar {
    width: 45px;
    height: 45px;
    background: #38bdf8;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.msg-box {
    max-height: 150px;
    overflow-y: auto;
    font-size: 14px;
    opacity: 0.85;
}

.input-box {
    border-radius: 10px;
    border: none;
    padding: 8px;
    width: 100%;
}

.send-btn {
    background: #22c55e;
    border: none;
    padding: 6px 15px;
    border-radius: 8px;
    color: white;
}

.send-btn:hover {
    background: #16a34a;
}

.product-box {
    font-size: 13px;
    opacity: 0.7;
}

.fade-in {
    animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(10px);} 
    to {opacity:1; transform: translateY(0);} 
}
</style>
</head>

<body>

<div class="container mt-4">

<h3 class="text-center mb-4">💬 Seller Chat Panel</h3>

{% for chat in chats %}
{% if chat.user %}

<div class="chat-card p-3 mb-3 fade-in">

    <!-- TOP -->
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex gap-2 align-items-center">
            <div class="avatar">
                {{ chat.user|slice:":1"|upper }}
            </div>
            <div>
                <b>{{ chat.user }}</b>
                <div class="product-box">
                    Product ID: {{ chat.product_id }}
                </div>
            </div>
        </div>
    </div>

    <!-- LAST MESSAGE -->
    <div class="msg-box mt-2 mb-2">
        📨 {{ chat.last_msg }}
    </div>

    <!-- INPUT + SEND -->
    <form method="POST" action="/userchatdata/" class="d-flex gap-2">
        {% csrf_token %}

        <input type="hidden" name="receiver" value="{{ chat.user }}">
        <input type="hidden" name="product_id" value="{{ chat.product_id }}">

        <input type="text" name="message" placeholder="Type reply..." class="input-box" required>

        <button type="submit" class="send-btn">Send</button>
    </form>

</div>

{% endif %}
{% endfor %}

</div>



<script>
// Show alert after sending message
const forms = document.querySelectorAll("form");
forms.forEach(form => {
    form.addEventListener("submit", function(e){
        e.preventDefault();

        const formData = new FormData(this);

        fetch(this.action, {
            method: "POST",
            body: formData,
            headers: {
                'X-CSRFToken': formData.get('csrfmiddlewaretoken')
            }
        })
        .then(res => res.json())
        .then(data => {
            showAlert("✅ Message Sent Successfully");
            form.reset();
        })
        .catch(err => {
            showAlert("❌ Error sending message");
        });
    });
});

function showAlert(msg){
    let alertBox = document.createElement("div");
    alertBox.innerText = msg;
    alertBox.style.position = "fixed";
    alertBox.style.top = "20px";
    alertBox.style.right = "20px";
    alertBox.style.background = "#22c55e";
    alertBox.style.padding = "10px 20px";
    alertBox.style.borderRadius = "10px";
    alertBox.style.boxShadow = "0 5px 15px rgba(0,0,0,0.3)";
    alertBox.style.zIndex = "9999";
    alertBox.style.fontWeight = "bold";

    document.body.appendChild(alertBox);

    setTimeout(()=>{
        alertBox.remove();
    }, 2000);
}
</script>

</body>
</html>
