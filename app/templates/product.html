<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Customer Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            font-family: 'Poppins', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 25px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: slideIn 1s ease;
        }

        .sidebar h5,
        .sidebar h6 {
            font-weight: bold;
        }

        .filter-btn {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px;
            transition: 0.3s;
        }

        .filter-btn:hover {
            background: white;
            color: #667eea;
            transform: scale(1.08);
        }

        /* PRODUCT CARDS */
        .product-card {
            border-radius: 20px;
            overflow: hidden;
            transition: 0.4s;
            background: white;
            animation: fadeUp 1s ease;
        }

        .product-card:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .product-card img {
            height: 200px;
            width: 100%;
            object-fit: cover;
        }

        /* CARD BODY */
        .product-card .p-3 {
            background: linear-gradient(135deg, #fdfbfb, #ebedee);
        }

        /* BUTTONS */
        .btn-buy {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: white;
            font-weight: bold;
            border-radius: 20px;
            transition: 0.3s;
        }

        .btn-buy:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px #ff512f;
        }

        .btn-chat {
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
            color: white;
            border-radius: 50%;
            padding: 6px 10px;
            transition: 0.3s;
        }

        .btn-chat:hover {
            transform: scale(1.2);
        }

        /* TITLE */
        h2 {
            font-weight: bold;
            animation: fadeIn 1s ease;
        }

        /* ANIMATIONS */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(-50px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>

</head>

<body>

    <div class="container my-5">
        <div class="row g-4">

            <!-- SIDEBAR -->

            <div class="col-md-3">
                <div class="sidebar">
                    <h5>Filters</h5>

                    ```
                    <button class="filter-btn">All Products</button>
                    <button class="filter-btn">Mobiles 📱</button>
                    <button class="filter-btn">Vehicles 🚗</button>
                    <button class="filter-btn">Laptops 💻</button>
                    <button class="filter-btn">Real Estate 🏠</button>

                    <hr style="background:white;">

                    <h6>Price Range</h6>
                    <button class="filter-btn">Below ₹10,000</button>
                    <button class="filter-btn">₹10,000 - ₹50,000</button>
                    <button class="filter-btn">Above ₹50,000</button>

                    <hr style="background:white;">

                    <h6>Quick</h6>
                    <button class="filter-btn"><i class="bi bi-chat"></i> Chats</button>
                </div>
                ```

            </div>

            <!-- PRODUCTS -->

            <div class="col-md-9">
                <h2 class="text-center mb-4">🔥 All Products</h2>

                ```
                <div class="row g-4">

                    {% for p in products %}
                    <div class="col-md-4">

                        <div class="product-card">

                            {% if p.image %}
                            <img src="{{ p.image.url }}">
                            {% else %}
                            <img src="https://via.placeholder.com/300">
                            {% endif %}

                            <div class="p-3">
                                <h6>{{ p.name }}</h6>
                                <p><b>₹{{ p.price }}</b></p>

                                <div class="d-flex justify-content-between align-items-center">

                                    <a href="" class="btn btn-chat">
                                        <i class="bi bi-chat"></i>
                                    </a>

                                    <a href="" class="btn btn-buy btn-sm px-3">
                                        Buy Now
                                    </a>

                                </div>

                            </div>
                        </div>

                    </div>
                    {% endfor %}

                </div>

            </div>

        </div>
    </div>

</body>

</html>
