<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #c2e9fb, #a1c4fd);
            font-family: 'Poppins', sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .sidebar:hover {
            transform: translateY(-5px);
        }

        .sidebar h5,
        .sidebar h6 {
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* FILTER BUTTONS */
        .filter-btn {
            width: 100%;
            margin-bottom: 10px;
            border-radius: 12px;
            border: none;
            background: #ffffff;
            padding: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .filter-btn:hover {
            background: linear-gradient(135deg, #6ee7b7, #3b82f6);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* PRICE LINKS */
        .sidebar a {
            display: block;
            margin-bottom: 8px;
            text-decoration: none;
            color: #444;
            padding: 8px 10px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: #3b82f6;
            color: #fff;
            transform: translateX(5px);
        }

        /* TOP BAR */
        .top-bar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        /* PRODUCT CARD */
        .product-card {
            border-radius: 20px;
            background: #fff;
            overflow: hidden;
            border: none;
            transition: all 0.4s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .product-card img {
            height: 210px;
            width: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .product-body {
            padding: 18px;
        }

        .price {
            color: #16a34a;
            font-weight: 600;
            font-size: 18px;
        }

        /* BUTTONS */
        .btn-primary {
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn-danger {
            border-radius: 10px;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
        }

    </style>
</head>

<body>

    <div class="container my-4">
        <div class="row">

            <!-- SIDEBAR -->
            <div class="col-md-3">
                <div class="sidebar">

                    <h5>Filters</h5>

                    <a href="?category=all" class="filter-btn d-block text-center">All Products</a>
                    <a href="?category=mobiles" class="filter-btn d-block text-center">Mobiles 📱</a>
                    <a href="?category=vehicles" class="filter-btn d-block text-center">Vehicles 🚗</a>
                    <a href="?category=laptops" class="filter-btn d-block text-center">Laptops 💻</a>
                    <a href="?category=realestate" class="filter-btn d-block text-center">Real Estate 🏠</a>

                    <hr>

                    <h6>Price Range</h6>

                    <a href="{% url 'sort' %}?sort=0-999">Below ₹1000</a>

                    <a href="{% url 'sort' %}?sort=1000-5000">
                        ₹1000 - ₹5000
                    </a>

                    <a href="{% url 'sort' %}?sort=5000plus">
                        Above ₹5000
                    </a>

                </div>
            </div>

            <!-- PRODUCTS -->
            <div class="col-md-9">

                <div class="top-bar d-flex justify-content-between align-items-center">
                    <h5>Products</h5>
                    <input type="text" class="form-control w-50" placeholder="Search...">
                </div>

                <div class="row g-4">

                    {% if items %}
                    {% for item in items %}
                    <div class="col-md-4">

                        <div class="product-card">

                            <img src="{{ item.productimg.url }}" alt="img">

                            <div class="product-body">
                                <div class="price">₹{{ item.productprice }}</div>
                                <div>{{ item.productname }}</div>

                                <div class="d-flex justify-content-between mt-3">
                                    <a href="#" class="btn btn-sm btn-primary">Chat</a>
                                    <a href="#" class="btn btn-sm btn-danger">Buy</a>
                                </div>
                            </div>

                        </div>

                    </div>
                    {% endfor %}
                    {% else %}
                    <h3>No Products Found 😢</h3>
                    {% endif %}

                </div>

            </div>

        </div>
    </div>

</body>

</html>
