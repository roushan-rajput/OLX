<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif
        }

        body {
            display: flex;
            height: 100vh;
            background: #f1f3f6
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #0f172a;
            color: #fff;
            padding: 20px;
            transition: .3s
        }

        .sidebar h2 {
            margin-bottom: 20px
        }

        .sidebar ul {
            list-style: none
        }

        .sidebar li {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: .3s
        }

        .sidebar li:hover {
            background: #1e293b;
            transform: translateX(6px)
        }

        /* Main */
        .main {
            flex: 1;
            padding: 20px;
            overflow-y: auto
        }

        .header {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn .6s
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            transition: .3s;
            position: relative;
            overflow: hidden
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02)
        }

        .card::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 5px;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
        }

        .section {
            margin-top: 25px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
            animation: slideUp .6s
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px
        }

        .table th,
        .table td {
            padding: 12px;
            border-bottom: 1px solid #eee
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: .3s
        }

        .edit {
            background: #3b82f6;
            color: #fff
        }

        .delete {
            background: #ef4444;
            color: #fff
        }

        .btn:hover {
            opacity: .8
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .5);
            display: none;
            align-items: center;
            justify-content: center
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            animation: fadeIn .3s
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>⚡ Admin</h2>
        <ul>
            <li onclick="showSection('dashboard')">Dashboard</li>
            <li onclick="showSection('users')">Users</li>
            <li onclick="showSection('products')">Products</li>
            <li onclick="showSection('orders')">Orders</li>
        </ul>
    </div>

    <div class="main">

        <div class="header">
            <h1>Dashboard 🚀</h1>
            <button class="btn edit" onclick="toggleTheme()">Toggle Theme</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="section">
            <h2>Overview</h2>
            <div class="cards">
                <div class="card">Users: <b id="userCount">120</b></div>
                <div class="card">Products: 80</div>
                <div class="card">Orders: 45</div>
                <div class="card">Revenue: ₹50,000</div>
            </div>
        </div>

        <!-- Users -->
        <div id="users" class="section" style="display:none">
            <h2>User Management</h2>
            <button class="btn edit" onclick="openModal()">+ Add User</button>
            <table class="table" id="userTable">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </table>
        </div>

        <!-- Products -->
        <div id="products" class="section" style="display:none">
            <h2>Products</h2>
            <p>Coming soon...</p>
        </div>

        <!-- Orders -->
        <div id="orders" class="section" style="display:none">
            <h2>Orders</h2>
            <p>Coming soon...</p>
        </div>

    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Add User</h3>
            <input type="text" id="name" placeholder="Name"><br><br>
            <input type="email" id="email" placeholder="Email"><br><br>
            <button class="btn edit" onclick="addUser()">Save</button>
            <button class="btn delete" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let users = [
            { name: 'Rahul', email: 'rahul@mail.com' }
        ];

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function renderUsers() {
            const table = document.getElementById('userTable');
            table.innerHTML = '<tr><th>Name</th><th>Email</th><th>Action</th></tr>';

            users.forEach((u, i) => {
                table.innerHTML += `<tr>
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>
        <button class='btn delete' onclick='deleteUser(${i})'>Delete</button>
      </td>
    </tr>`;
            });

            document.getElementById('userCount').innerText = users.length;
        }

        function addUser() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            if (!name || !email) return alert('Fill all fields');

            users.push({ name, email });
            renderUsers();
            closeModal();
        }

        function deleteUser(i) {
            users.splice(i, 1);
            renderUsers();
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function toggleTheme() {
            document.body.style.background = document.body.style.background === 'black' ? '#f1f3f6' : 'black';
        }

        renderUsers();
    </script>

</body>

</html>
