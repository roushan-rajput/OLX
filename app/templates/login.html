<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>OLX Pro Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
animation:fadeIn 1.5s ease;
}

.login-container{
width:400px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
padding:40px;
border-radius:20px;
box-shadow:0 20px 60px rgba(0,0,0,0.5);
animation:slideUp 1s ease;
}

.login-container h2{
text-align:center;
margin-bottom:25px;
color:white;
animation:glowText 2s infinite alternate;
}

.input-group{position:relative;margin-bottom:25px;}

.input-group input{
width:100%;
padding:12px;
border:none;
border-bottom:2px solid #94a3b8;
background:transparent;
color:white;
outline:none;
}

.input-group input::placeholder{color:#94a3b8;}

.input-group input:focus{
border-bottom:2px solid #667eea;
}

.login-btn{
width:100%;
padding:12px;
border:none;
background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
font-size:16px;
border-radius:30px;
cursor:pointer;
transition:0.4s;
}

.login-btn:hover{
transform:scale(1.1);
box-shadow:0 0 20px #667eea;
}

.links{text-align:center;margin-top:15px;}
.links a{color:#a5b4fc;text-decoration:none;transition:0.3s;}
.links a:hover{color:white;text-decoration:underline;}

/* Animations */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{transform:translateY(50px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes glowText{from{text-shadow:0 0 5px #667eea;}to{text-shadow:0 0 20px #764ba2;}}

</style>
</head>

<body>

<div class="login-container">

<h2>🔐 OLX Pro Login</h2>

{% if error %}
<div style="color:#ff6b6b;text-align:center;margin-bottom:10px;font-weight:bold;">
{{ error }}
</div>
{% endif %}

<form action="{% url 'logindata' %}" method="POST">
{% csrf_token %}

<div class="input-group">
<input type="email" name="email" placeholder="Enter Email" required>
</div>

<div class="input-group">
<input type="password" name="pass" placeholder="Enter Password" required>
</div>

<button type="submit" class="login-btn">Login 🚀</button>

<div class="links">
<p><a href="{% url 'forgetpage' %}">Forgot Password?</a></p>
</div>

<div class="links">
<p>Don't have an account? <a href="{% url 'Register' %}">Register</a></p>
</div>

</form>

</div>

</body>
</html>
