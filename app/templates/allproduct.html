{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My OLX App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f2f4f5;
}

header {
  background: #002f34;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 24px;
}

form {
  background: white;
  padding: 15px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

input, button {
  padding: 10px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  background: #23e5db;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #00b3ad;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transform: translateY(30px) scale(0.95);
  opacity: 0;
  transition: all 0.5s ease;
}

.card.show {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  color: #002f34;
}

.title {
  margin: 10px 0;
  font-size: 16px;
}

.fade-in {
  animation: fadeIn 0.6s ease forwards;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);} 
  to {opacity:1; transform:translateY(0);} 
}

</style>
</head>
<body>

<header>My OLX Style Django App</header>

<form method="POST" enctype="multipart/form-data">
  {% csrf_token %}
  <input type="text" name="title" placeholder="Item Title" required>
  <input type="text" name="price" placeholder="Price" required>
  <input type="file" name="image" required>
  <button type="submit">Post Item</button>
</form>

<div class="container" id="itemsContainer">
  {% for item in items %}
  <div class="card fade-in">
    <img src="{{ item.image.url }}" alt="item">
    <div class="card-content">
      <div class="price">₹{{ item.price }}</div>
      <div class="title">{{ item.title }}</div>
    </div>
  </div>
  {% endfor %}
</div>

<script>
// Animation delay effect
const cards = document.querySelectorAll('.card');

cards.forEach((card, index) => {
  setTimeout(() => {
    card.classList.add('show');
  }, index * 120);
});
</script>

</body>
</html>
