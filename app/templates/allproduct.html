{% load static %}
<!DOCTYPE html>
<html>

<head>
  <title>Dashboard</title>

  <style>
    body {
      font-family: Arial;
      background: #f2f4f5;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .content {
      padding: 10px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    .title {
      font-size: 16px;
    }
  </style>

</head>

<body>

  <h2 style="text-align:center;">All Products</h2>

  <div class="container">

    {% for item in items %}
    <div class="card">
      <img src="{{ item.productimg.url }}" alt="img">

      <div class="content">
        <div class="price">₹{{ item.productprice }}</div>
        <div class="title">{{ item.productname }}</div>
      </div>
    </div>
    {% endfor %}

  </div>

</body>

</html>
