{% load static %}
<!DOCTYPE html>
<html>

<head>
  <title>All Products</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Poppins;
    }

    body{
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
    }

    h2{
      text-align:center;
      padding:20px;
      font-size:32px;
      animation:glow 2s infinite alternate;
    }

    /* BACK BUTTON */
    .back-btn{
      padding:20px;
    }

    .back-btn button{
      padding:10px 20px;
      border:none;
      border-radius:25px;
      background:linear-gradient(135deg,#667eea,#764ba2);
      color:white;
      cursor:pointer;
      transition:0.4s;
    }

    .back-btn button:hover{
      transform:scale(1.1);
      box-shadow:0 0 15px #667eea;
    }

    /* GRID */
    .container{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
      padding:30px;
    }

    /* CARD */
    .card{
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 15px 40px rgba(0,0,0,0.6);
      transition:0.5s;
      animation:fadeUp 1s ease;
    }

    .card:hover{
      transform:translateY(-10px) scale(1.05);
      box-shadow:0 20px 50px rgba(0,0,0,0.9);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
      transition:0.5s;
    }

    .card:hover img{
      transform:scale(1.1);
    }

    .content{
      padding:15px;
      text-align:center;
    }

    .price{
      font-size:24px;
      font-weight:bold;
      color:#22c55e;
      margin-bottom:5px;
    }

    .title{
      font-size:18px;
      margin-bottom:10px;
      color:#e2e8f0;
    }

    /* BUTTONS */
    .btn-group{
      display:flex;
      justify-content:space-around;
      margin-top:10px;
    }

    .btn{
      padding:8px 15px;
      border:none;
      border-radius:20px;
      cursor:pointer;
      transition:0.4s;
      font-size:14px;
    }

    .edit-btn{
      background:linear-gradient(135deg,#3b82f6,#2563eb);
      color:white;
    }

    .edit-btn:hover{
      transform:scale(1.1);
      box-shadow:0 0 15px #3b82f6;
    }

    .delete-btn{
      background:linear-gradient(135deg,#ef4444,#dc2626);
      color:white;
    }

    .delete-btn:hover{
      transform:scale(1.1);
      box-shadow:0 0 15px #ef4444;
    }

    /* ANIMATIONS */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(40px);} 
      to{opacity:1;transform:translateY(0);} }

    @keyframes glow{
      from{text-shadow:0 0 5px #667eea;} 
      to{text-shadow:0 0 20px #764ba2;} }

  </style>

</head>

<body>

  <!-- BACK BUTTON -->
  <div class="back-btn">
    <a href="/shkprdash" class="bg-blue-500 px-4 py-1 rounded">Back</a>
  </div>

  <h2>🚀 All Products</h2>

  <div class="container">

    {% for item in items %}
    <div class="card">

      <img src="{{ item.productimg.url }}" alt="img">

      <div class="content">
        <div class="price">₹{{ item.productprice }}</div>
        <div class="title">{{ item.productname }}</div>

        <div class="btn-group">
          <a href="{% url 'edit_product' item.id %}">
            <button class="btn edit-btn">✏ Edit</button>
          </a>

          <a href="{% url 'delete_product' item.id %}" onclick="return confirm('Are you sure you want to delete?')">
            <button class="btn delete-btn">🗑 Delete</button>
          </a>
        </div>

      </div>

    </div>
    {% endfor %}

  </div>

</body>

</html>
