<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OLX Pro Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");
            background-size: cover;
        }

        .register-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .msg {
            text-align: center;
            color: green;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
        }

        .input-group label {
            position: absolute;
            left: 0;
            top: 12px;
            color: #999;
            transition: 0.3s;
        }

        /* Floating label fix */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label,
        .active {
            top: -10px;
            font-size: 12px;
            color: #667eea;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 25px;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="register-container">

    <!-- ✅ FIXED CONDITION -->
    <h2>{% if customer %}Edit Profile{% else %}Create Account{% endif %}</h2>

    <div class="msg">{{ msg }}</div>

    <form action="{% url 'reg_data' %}" method="POST">
        {% csrf_token %}

        <!-- NAME -->
        <div class="input-group">
            <input type="text" name="name" value="{{ customer.name|default:'' }}" placeholder=" " required>
            <label class="{% if customer.name %}active{% endif %}">Name</label>
        </div>

        <!-- EMAIL -->
        <div class="input-group">
            <input type="text" name="email" value="{{ customer.email|default:'' }}" placeholder=" " required>
            <label class="{% if customer.email %}active{% endif %}">Email</label>
        </div>

        <!-- CONTACT -->
        <div class="input-group">
            <input type="text" name="contact" value="{{ customer.contact|default:'' }}" placeholder=" " required>
            <label class="{% if customer.contact %}active{% endif %}">Contact</label>
        </div>

        <!-- CITY -->
        <div class="input-group">
            <input type="text" name="city" value="{{ customer.city|default:'' }}" placeholder=" " required>
            <label class="{% if customer.city %}active{% endif %}">City</label>
        </div>

        <!-- PASSWORD -->
        <div class="input-group">
            <input type="password" name="password" placeholder=" ">
            <label>Password</label>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="input-group">
            <input type="password" name="cpassword" placeholder=" ">
            <label>Confirm Password</label>
        </div>

        <!-- ROLE -->
        <select name="role">
            <option value="buyer" {% if customer and customer.role == 'buyer' %}selected{% endif %}>Buyer</option>
            <option value="seller" {% if customer and customer.role == 'seller' %}selected{% endif %}>Seller</option>
        </select>

        <!-- BUTTON -->
        <button class="register-btn">
            {% if customer %}Update Profile{% else %}Register{% endif %}
        </button>

        <div class="login-link">
            <a href="{% url 'login' %}">Go to Login</a>
        </div>

    </form>

</div>

</body>
</html>
