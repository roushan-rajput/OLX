<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>OLX Pro Register</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, .85), rgba(0, 0, 0, .85)),
                url("https://images.unsplash.com/photo-1522202176988-66273c2fd55f");
            background-size: cover;
        }

        /* CONTAINER */
        .register-container {
            width: 340px;
            background: #111827;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
            animation: fadeUp .7s ease;
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .msg {
            text-align: center;
            color: #22c55e;
            font-size: 13px;
            margin-bottom: 10px;
        }

        /* INPUT */
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: none;
            border-bottom: 2px solid #555;
            outline: none;
            background: transparent;
            color: #fff;
        }

        .input-group label {
            position: absolute;
            left: 0;
            top: 10px;
            color: #aaa;
            font-size: 13px;
            transition: .3s;
        }

        /* FLOAT LABEL */
        .input-group input:focus+label,
        .input-group input:not(:placeholder-shown)+label,
        .active {
            top: -8px;
            font-size: 11px;
            color: #3b82f6;
        }

        /* ICON */
        .input-group i {
            position: absolute;
            right: 5px;
            top: 10px;
            color: #888;
        }

        /* SELECT */
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 8px;
            background: #1f2937;
            color: #fff;
            border: none;
        }

        /* BUTTON */
        .register-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #3b82f6;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            transition: .3s;
        }

        .register-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #3b82f6;
        }

        /* LINK */
        .login-link {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .login-link a {
            color: #3b82f6;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* ANIMATION */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* INPUT FOCUS */
        .input-group input:focus {
            border-bottom: 2px solid #3b82f6;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h2>{% if customer %}Edit Profile{% else %}Create Account{% endif %}</h2>

        <div class="msg">{{ msg }}</div>

        <form action="{% url 'reg_data' %}" method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" name="name" value="{{ customer.name|default:'' }}" placeholder=" " required>
                <label class="{% if customer.name %}active{% endif %}">Name</label>
                <i class="bi bi-person"></i>
            </div>

            <div class="input-group">
                <input type="text" name="email" value="{{ customer.email|default:'' }}" placeholder=" " required>
                <label class="{% if customer.email %}active{% endif %}">Email</label>
                <i class="bi bi-envelope"></i>
            </div>

            <div class="input-group">
                <input type="text" name="contact" value="{{ customer.contact|default:'' }}" placeholder=" " required>
                <label class="{% if customer.contact %}active{% endif %}">Contact</label>
                <i class="bi bi-phone"></i>
            </div>

            <div class="input-group">
                <input type="text" name="city" value="{{ customer.city|default:'' }}" placeholder=" " required>
                <label class="{% if customer.city %}active{% endif %}">City</label>
                <i class="bi bi-geo-alt"></i>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder=" ">
                <label>Password</label>
                <i class="bi bi-lock"></i>
            </div>

            <div class="input-group">
                <input type="password" name="cpassword" placeholder=" ">
                <label>Confirm Password</label>
                <i class="bi bi-shield-lock"></i>
            </div>

            <!-- FIXED CONDITION -->
            <select name="role">
                <option value="buyer" {% if customer and customer.role == 'buyer' %}selected{% endif %}>Buyer</option>
                <option value="seller" {% if customer and customer.role == 'seller' %}selected{% endif %}>Seller</option>
            </select>

            <button class="register-btn">
                {% if customer %}Update Profile{% else %}Register{% endif %}
            </button>

            <div class="login-link">
                <a href="{% url 'login' %}">Go to Login</a>
            </div>

        </form>

    </div>

</body>

</html>
