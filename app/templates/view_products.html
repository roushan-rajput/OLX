<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body class="bg-gradient-to-r from-gray-900 to-gray-800 text-white">

<!-- Navbar -->
<nav class="bg-black p-4 flex justify-between">
    <h1 class="text-xl font-bold">📦 Products Panel</h1>
    <a href="/superadmin" class="bg-blue-500 px-4 py-1 rounded">Back</a>
</nav>

<!-- Heading -->
<div class="text-center py-8">
    <h2 class="text-3xl font-bold">All Products</h2>
</div>

<!-- Products Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-10 pb-10">

    {% for p in products %}
    <div class="card bg-white/10 p-6 rounded-2xl shadow-lg">
        
        <img src="{{ p.productimg.url }}" class="w-full h-40 object-cover rounded mb-4">
        
        <h3 class="text-xl font-bold">{{ p.productname }}</h3>
        <p class="text-green-400">₹ {{ p.productprice }}</p>
        
        <p class="text-gray-300 mt-2">Issue: {{ p.productissue }}</p>
        <p class="text-gray-400">Reason: {{ p.productreason }}</p>

        <p class="text-blue-400 mt-2">Seller: {{ p.seller_email }}</p>
        
        <div class="mt-4 flex justify-between">
            <button class="bg-red-500 px-3 py-1 rounded">Delete</button>
            <button class="bg-yellow-500 px-3 py-1 rounded">Block</button>
        </div>

    </div>
    {% endfor %}

</div>

<!-- Empty Case -->
{% if products|length == 0 %}
<div class="text-center text-gray-400">
    No products found.
</div>
{% endif %}

</body>
</html>
